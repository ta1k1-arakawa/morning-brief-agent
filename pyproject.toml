[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-brief-agent"
version = "0.1.0"
description = "Create a daily brief from Google Calendar, Gmail, and Todoist."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "openai>=1.66,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
]

[project.scripts]
morning-brief = "morning_brief.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
